<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VozSalud - Hábitos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="app-container">

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i data-lucide="mic-2"></i>
            </div>

            <div>
                <h1>VozSalud</h1>
                <span data-i18n="appSubtitle">Cuidado vocal</span>
            </div>

        </div>

        <nav class="sidebar-nav">

            <a href="index.html" class="nav-item">
                <i data-lucide="calendar-days"></i>
                <span data-i18n="calendar">Calendario</span>
            </a>

            <a href="habitos.html" class="nav-item active">
                <i data-lucide="heart-pulse"></i>
                <span data-i18n="habits">Hábitos</span>
            </a>

            <a href="informacion.html" class="nav-item">
                <i data-lucide="info"></i>
                <span data-i18n="information">Información</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="language-box">
                <i data-lucide="languages"></i>

                <select id="languageSelector">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="sidebar-footer">
                <span data-i18n="footerText">Bienestar y cuidado de tu voz</span>
            </div>

        </div>

    </aside>

    <main class="main-content">

        <header class="mobile-header">

            <button class="mobile-menu-button" id="mobileMenuButton">
                <i data-lucide="menu"></i>
            </button>

            <div class="mobile-brand">
                <i data-lucide="mic-2"></i>
                <span>VozSalud</span>
            </div>

        </header>

        <section class="page-header habits-page-header">

            <div>

                <span class="eyebrow" data-i18n="habitsEyebrow">
                    Cuidado diario
                </span>

                <h2 id="habitsPageTitle" data-i18n="habitsTitle">
                    Hábitos para cuidar tu voz
                </h2>

                <p id="habitsPageDescription" data-i18n="habitsDescription">
                    Conoce prácticas sencillas que pueden ayudarte a mantener una buena higiene vocal.
                </p>

            </div>

        </section>

        <section id="habitsList" class="habits-grid"></section>

        <section id="habitDetail" class="habit-detail" style="display: none;"></section>

    </main>

</div>

<script src="js/idiomas.js"></script>
<script src="js/habitos.js"></script>
<script src="js/app.js"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
